x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    BUILD_REV: ${GIT_SHA:-local}
    RUST_IMAGE: ${RUST_IMAGE:-rust:1.96.0-bookworm}
    RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:12.14-slim}

x-frontend-build: &frontend-build
  context: ./frontend
  dockerfile: Dockerfile

services:
  db:
    image: postgres:16.14-alpine
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pvzbd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  backend:
    image: pvz-backend:local
    build: *backend-build
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/pvzbd
      RUST_LOG: info
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  frontend:
    image: pvz-platform-frontend:local
    build: *frontend-build
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  pgdata:
  uploads:
