services:
  db:
    image: postgres:16
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pvzbd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: pvz-backend
    pull_policy: never
    command: ["sqlx", "migrate", "run"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/pvzbd
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: pvz-backend
    pull_policy: never
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/pvzbd
      RUST_LOG: info
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: pvz-platform-frontend
    pull_policy: never
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
